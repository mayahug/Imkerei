<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imkerjahr Planer</title>
<style>
  :root {
    --bg: #fbf8f1; --card: #ffffff; --text: #2b2418; --muted: #75694f;
    --accent: #d99a1e; --accent-soft: #fbecc8; --line: #eadfc6; --weekend: #fff4dc;
    --done: #9b9078;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1812; --card: #25211a; --text: #f1e9d8; --muted: #b4a787;
      --accent: #f0b43c; --accent-soft: #3d3220; --line: #3a3326; --weekend: #2f2819;
      --done: #7d735e;
    }
  }
  :root[data-theme="dark"] {
      --bg: #1b1812; --card: #25211a; --text: #f1e9d8; --muted: #b4a787;
      --accent: #f0b43c; --accent-soft: #3d3220; --line: #3a3326; --weekend: #2f2819;
      --done: #7d735e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 24px 16px 8px; max-width: 900px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.6rem; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 0; }
  nav { max-width: 900px; margin: 12px auto 0; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--text);
               padding: 6px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #2b2418; font-weight: 600; }
  nav button:disabled { opacity: .45; cursor: default; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .controls { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
              padding: 16px; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
  .controls input, .controls select { font: inherit; color: var(--text); background: var(--bg);
              border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text);
              border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .controls small { font-size: .8em; }
  .window:empty { display: none; }
  .window { background: var(--accent-soft); border-radius: 10px; padding: 12px; }
  .window h2 { margin: 0 0 4px; font-size: 1rem; }
  .window p { margin: 0 0 8px; font-size: .9rem; color: var(--muted); }
  .window p.warn { color: var(--text); font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls .chip { color: var(--text); flex-direction: column; gap: 0; }
  .chip { position: relative; display: flex; flex-direction: column; align-items: flex-start; border: 1px solid var(--line);
          background: var(--card); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .chip:has(input:disabled) { opacity: .45; cursor: not-allowed; }
  .chip:has(input:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }
  .chip .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip b { font-variant-numeric: tabular-nums; }
  .controls .wide { grid-column: 1 / -1; }
  .hint:empty { display: none; }
  .hint { grid-column: 1 / -1; margin: 0; font-size: .85rem; color: var(--muted); }
  ol.tasks { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  .task.weekend { background: var(--weekend); }
  .task.anchor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .task.done .title, .task.done .desc { color: var(--done); text-decoration: line-through; }
  .when { grid-row: span 2; min-width: 7.5rem; }
  .date { font-weight: 700; font-variant-numeric: tabular-nums; }
  .wd { color: var(--muted); font-size: .9rem; }
  .day { display: inline-block; margin-top: 4px; font-size: .75rem; background: var(--accent-soft);
         border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .title { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .title input { transform: translateY(2px); accent-color: var(--accent); }
  .desc { color: var(--muted); font-size: .92rem; }
  .today-badge { font-size: .7rem; background: var(--accent); color: #2b2418; border-radius: 4px; padding: 0 6px; }
  footer { max-width: 900px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: .8rem; }
  @media (max-width: 560px) {
    .controls { grid-template-columns: 1fr; }
    .task { grid-template-columns: 1fr; }
    .when { grid-row: auto; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .day { margin-top: 0; }
  }
  @media print {
    nav, .actions, .hint, footer { display: none; }
    body { background: #fff; color: #000; }
    .task { break-inside: avoid; border-color: #bbb; }
  }
</style>
</head>
<body>
<header>
  <h1>Imkerjahr <span>Planer</span></h1>
  <p class="sub">Aufgaben im Bienenjahr mit Datum und Wochentag planen.</p>
</header>
<nav id="modules" aria-label="Bereiche"></nav>
<main>
  <section class="controls">
    <label class="wide">Zuchtmethode
      <select id="method"></select>
    </label>
    <p class="hint" id="method-info"></p>
    <label>Auffuhr auf die Belegstelle <small>(optional)</small>
      <input type="date" id="beleg">
    </label>
    <label id="start-wrap">Start <small>(leer = heute)</small>
      <input type="date" id="start">
    </label>
    <div class="window wide" id="window"></div>
    <div class="actions">
      <button type="button" id="ics">Kalenderdatei (.ics)</button>
      <button type="button" id="print">Drucken</button>
      <button type="button" id="reset">Häkchen zurücksetzen</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>
  <ol class="tasks" id="tasks"></ol>
</main>
<footer>
  Richtwerte für das Umlarven von ca. 1 Tag alten Larven. Witterung und Volksstärke können die Abläufe um einige Tage verschieben.
</footer>

<script>
/* ---------- Daten: hier lassen sich weitere Bereiche ergänzen ---------- */
// Auffuhr auf die Belegstelle, in Tagen nach dem Umlarven:
// frühestens nach der Kellerhaft (Königin ca. 1 Tag alt), spätestens bevor die Hochzeitsflüge beginnen.
const AUFFUHR_FRUEH = 13;
const AUFFUHR_SPAET = 16;
const AUFFUHR_DESC = "Begattungseinheiten nach der Kellerhaft auf die Belegstelle bringen. Die jungen Königinnen müssen dort sein, bevor sie zum Hochzeitsflug ausfliegen.";

// Gemeinsame Schritte ab der Annahmekontrolle (gleich für alle Methoden)
const ZUCHT_GEMEINSAM = [
  { id: "begattung-vorb", day: 9, title: "Begattungseinheiten bilden",
    desc: "Begattungsvölkchen bzw. Kunstschwärme bilden, damit sie am nächsten Tag weisellos sind und die Zelle annehmen." },
  { id: "verschulen", day: 10, title: "Zellen verschulen / verteilen",
    desc: "Reife Weiselzellen vorsichtig ausschneiden und in die Begattungseinheiten (z. B. EWK) geben. Danach ca. 3 Tage kühl und dunkel in Kellerhaft stellen. Letzter sicherer Tag!" },
  { id: "schlupf", day: 12, title: "Schlupf der Königinnen",
    desc: "Die Königinnen schlüpfen. Begattungseinheiten nicht stören." },
  { id: "hochzeitsflug", day: 18, title: "Zeitraum Hochzeitsflüge",
    desc: "Etwa 5–7 Tage nach dem Schlupf fliegen die Königinnen zur Begattung aus. Bei schönem Wetter auf Flugbetrieb achten, nicht öffnen." },
  { id: "eilage", day: 24, title: "Kontrolle Eilage",
    desc: "Nachsehen, ob die Königin begattet ist und Eier legt. Unbegattete oder verlorene Königinnen vermerken." },
  { id: "brutbild", day: 30, title: "Brutbild prüfen & Königin zeichnen",
    desc: "Geschlossenes Brutbild mit Arbeiterinnenbrut? Dann Königin zeichnen (Jahresfarbe) und ggf. Flügel beschneiden." },
  { id: "verwenden", day: 35, title: "Königin verwenden",
    desc: "Begattete Königin in ein Wirtschaftsvolk einweiseln oder die Begattungseinheit zum Jungvolk erweitern." }
];
const ZUCHTWABE = { id: "zuchtwabe", day: -4, title: "Zuchtwabe ins Zuchtvolk hängen",
  desc: "Helle, leere Wabe in die Mitte des Zuchtvolks hängen, damit die Königin sie bestiftet. So sind die Larven am Umlarvtag ca. 1 Tag alt." };
const ANNAHME = { id: "annahme", day: 2, title: "Annahmekontrolle",
  desc: "Nachsehen, wie viele Zellen angenommen und gepflegt werden (Futtersaft, verlängerte Zellen). Ergebnis notieren." };

const MODULES = [
  {
    id: "koeniginnenzucht",
    name: "Königinnenzucht",
    hint: "Tag 0 ist das Umlarven. Ohne Belegstellendatum startet der Plan heute (oder am gewählten Starttag). Mit Belegstellendatum wählst du den Starttag aus den möglichen Terminen.",
    methods: [
      {
        id: "pflegevolk",
        name: "Pflegevolk",
        info: "Dem Pflegevolk wird ca. 2 Stunden vor dem Umlarven die Königin entnommen, danach kommt der Zuchtrahmen hinein. Was das Volk auf den eigenen Waben nachzieht, kann man ausbrechen oder schlüpfen lassen.",
        tasks: [
          ZUCHTWABE,
          { id: "anbrueten", day: -1, title: "Zuchtrahmen vorbereiten & Pflegevolk füttern",
            desc: "Zuchtrahmen mit Weiselbechern bereitmachen. Pflegevolk füttern (Futterteig oder Flüssigfutter 1:1), damit es in Pflegestimmung kommt." },
          { id: "koenigin-raus", day: 0, title: "Königin aus dem Pflegevolk entnehmen",
            desc: "Ca. 2 Stunden vor dem Umlarven die Königin aus dem Pflegevolk nehmen (z. B. in einen Ableger oder Käfig). So spürt das Volk die Weisellosigkeit, wenn der Zuchtrahmen kommt." },
          { id: "umlarven", day: 0, title: "Umlarven & Zuchtrahmen einsetzen",
            desc: "Jüngste Larven in die Weiselbecher übertragen und den Zuchtrahmen ins Pflegevolk hängen, zwischen Waben mit offener Brut." },
          ANNAHME,
          { id: "verdeckelt", day: 5, title: "Weiselzellen verdeckelt – eigene Nachschaffungszellen?",
            desc: "Die Zellen sind verdeckelt, Zuchtrahmen nicht schütteln. Die Nachschaffungszellen, die das Volk auf den eigenen Waben angelegt hat, kann man ausbrechen oder schlüpfen lassen, ganz wie man will. Lässt man sie stehen: Sie können aus älteren Larven stammen und früher schlüpfen. Darum den Zuchtrahmen spätestens an Tag 9–10 entnehmen." },
          ...ZUCHT_GEMEINSAM
        ]
      },
      {
        id: "anbrueter",
        name: "Anbrüter + Pflegevolk",
        info: "Die Larven werden 24 Stunden in einem weisellosen, brutfreien Anbrüter (Starter) angepflegt und danach in einem weiselrichtigen Pflegevolk (Finisher) fertig gepflegt.",
        tasks: [
          ZUCHTWABE,
          { id: "pflege-vorb", day: -1, title: "Pflegevolk & Anbrüterkiste vorbereiten",
            desc: "Im späteren Pflegevolk offene Brut über das Absperrgitter hängen. Anbrüterkiste mit Futter- und Pollenwabe sowie Wassergabe bereitstellen." },
          { id: "anbrueter-bilden", day: 0, title: "Anbrüter bilden (morgens)",
            desc: "2–3 Stunden vor dem Umlarven reichlich junge Bienen (ca. 1–1,5 kg) ohne Königin in die Anbrüterkiste fegen und kühl und dunkel stellen." },
          { id: "umlarven", day: 0, title: "Umlarven",
            desc: "Jüngste Larven in die Weiselbecher übertragen und den Zuchtrahmen in den Anbrüter geben." },
          { id: "umhaengen", day: 1, title: "Zuchtrahmen ins Pflegevolk umhängen",
            desc: "Nach ca. 24 Stunden die angepflegten Zellen ins weiselrichtige Pflegevolk über das Absperrgitter hängen. Zuvor dort Nachschaffungszellen ausbrechen. Anbrüterbienen zurück ins Volk geben." },
          ANNAHME,
          { id: "verdeckelt", day: 5, title: "Weiselzellen verdeckelt",
            desc: "Die Zellen sind verdeckelt. Im Honigraum nochmals Nachschaffungszellen ausbrechen. Zuchtrahmen nicht schütteln." },
          ...ZUCHT_GEMEINSAM
        ]
      },
      {
        id: "weisellos",
        name: "Königin aus Volk entfernt",
        info: "Dem Pflegevolk wird 9 Tage vorher die Königin entnommen. Am Umlarvtag gibt es keine jungen Larven mehr, und alle Nachschaffungszellen werden ausgebrochen.",
        tasks: [
          { id: "entweiseln", day: -9, title: "Pflegevolk entweiseln",
            desc: "Königin aus dem vorgesehenen Pflegevolk entnehmen (z. B. als Ableger). Das Volk soll stark sein und viele junge Ammenbienen haben." },
          ZUCHTWABE,
          { id: "anbrueten", day: -1, title: "Zuchtrahmen vorbereiten & Pflegevolk füttern",
            desc: "Zuchtrahmen mit Weiselbechern zum Anputzen ins Pflegevolk hängen. Pflegevolk füttern (Futterteig oder Flüssigfutter 1:1)." },
          { id: "umlarven", day: 0, title: "Umlarven",
            desc: "Zuerst alle Nachschaffungszellen im Pflegevolk restlos ausbrechen. Dann die jüngsten Larven in die Weiselbecher übertragen und den Zuchtrahmen einhängen." },
          ANNAHME,
          { id: "verdeckelt", day: 5, title: "Weiselzellen verdeckelt",
            desc: "Die Zellen sind verdeckelt. Kurz kontrollieren, Zuchtrahmen nicht schütteln. Übersehene Nachschaffungszellen im Pflegevolk ausbrechen." },
          ...ZUCHT_GEMEINSAM
        ]
      }
    ]
  },
  { id: "jahr", name: "Bienenjahr (bald)", disabled: true, methods: [] }
];

/* ---------- Hilfsfunktionen ---------- */
const WEEKDAYS = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (date, n) => { const r = new Date(date); r.setDate(r.getDate() + n); return r; };
const fmt = d => d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" });
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const sameDay = (a, b) => iso(a) === iso(b);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Zustand ---------- */
let moduleId = store.get("modul", MODULES[0].id);
const $ = id => document.getElementById(id);
const current = () => MODULES.find(m => m.id === moduleId && !m.disabled) || MODULES[0];
const stateKey = () => `plan:${current().id}`;
const loadState = () => {
  const s = store.get(stateKey(), {});
  return { method: current().methods[0].id, beleg: "", start: "", done: {}, ...s };
};
const saveState = s => store.set(stateKey(), s);
const currentMethod = s => current().methods.find(x => x.id === s.method) || current().methods[0];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const firstDay = method => Math.min(...method.tasks.map(t => t.day));
const sign = n => (n > 0 ? "+" : "") + n;

// Mögliche Starttermine (= erste Aufgabe), damit die Auffuhr zum Belegstellendatum passt
function startOptions(s) {
  if (!s.beleg) return [];
  const beleg = parseDate(s.beleg), f = firstDay(currentMethod(s)), t0 = today();
  const opts = [];
  for (let k = AUFFUHR_SPAET; k >= AUFFUHR_FRUEH; k--) {
    const date = addDays(beleg, f - k);
    opts.push({ date, past: date < t0, queenAge: k - 12 });
  }
  return opts;
}

// Gewählter Starttag
function startDate(s) {
  if (s.beleg) {
    const opts = startOptions(s);
    const chosen = opts.find(o => iso(o.date) === s.start && !o.past);
    return (chosen || opts.find(o => !o.past) || opts[opts.length - 1]).date;
  }
  return s.start ? parseDate(s.start) : today();
}

function schedule(s) {
  const method = currentMethod(s);
  const umlarven = addDays(startDate(s), -firstDay(method));
  const auffuhrDay = s.beleg ? Math.round((parseDate(s.beleg) - umlarven) / 864e5) : AUFFUHR_FRUEH;
  const tasks = [...method.tasks, {
    id: "auffuhr", day: auffuhrDay,
    title: s.beleg ? "Auffuhr auf die Belegstelle" : "Auffuhr auf die Belegstelle (frühestens)",
    desc: s.beleg ? AUFFUHR_DESC : `${AUFFUHR_DESC} Möglich von Tag +${AUFFUHR_FRUEH} bis Tag +${AUFFUHR_SPAET}.`
  }].sort((x, y) => x.day - y.day);
  return tasks.map(t => ({ ...t, date: addDays(umlarven, t.day), isAnchor: t.id === "auffuhr" && !!s.beleg }));
}

const dateWd = d => `${WEEKDAYS[d.getDay()].slice(0, 2)}, ${fmt(d)}`;

function renderNav() {
  $("modules").innerHTML = MODULES.map(m =>
    `<button type="button" data-id="${m.id}" aria-pressed="${m.id === current().id}" ${m.disabled ? "disabled" : ""}>${esc(m.name)}</button>`
  ).join("");
}

function renderControls() {
  const m = current(), s = loadState(), method = currentMethod(s);
  $("method").innerHTML = m.methods.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
  $("method").value = method.id;
  $("method-info").textContent = method.info || "";
  $("beleg").value = s.beleg;
  $("start-wrap").hidden = !!s.beleg;
  $("start").value = s.beleg ? "" : s.start;
  $("hint").textContent = m.hint || "";
  renderWindow();
}

function renderWindow() {
  const s = loadState();
  if (!s.beleg) {
    const umlarven = addDays(startDate(s), -firstDay(currentMethod(s)));
    $("window").innerHTML = `<h2>Auffuhr auf die Belegstelle möglich</h2>
      <p>frühestens <b>${dateWd(addDays(umlarven, AUFFUHR_FRUEH))}</b> · spätestens <b>${dateWd(addDays(umlarven, AUFFUHR_SPAET))}</b></p>`;
    return;
  }
  const opts = startOptions(s), sel = iso(startDate(s));
  const method = currentMethod(s), firstTask = method.tasks.find(t => t.day === firstDay(method));
  const allPast = opts.every(o => o.past);
  const first = opts[0].date, last = opts[opts.length - 1].date;
  $("window").innerHTML = `<h2>Wann startest du?</h2>
    <p>Für die Auffuhr am <b>${dateWd(parseDate(s.beleg))}</b> musst du frühestens am <b>${dateWd(first)}</b>
      und spätestens am <b>${dateWd(last)}</b> starten.<br>Erster Schritt: ${esc(firstTask.title)}.</p>
    ${allPast ? '<p class="warn">Alle möglichen Starttermine liegen in der Vergangenheit. Bitte ein späteres Belegstellendatum wählen.</p>' : ""}
    <div class="chips" role="radiogroup" aria-label="Starttermin">${opts.map((o, i) => `
      <label class="chip"><input type="radio" name="startopt" value="${iso(o.date)}" ${iso(o.date) === sel ? "checked" : ""} ${o.past && !allPast ? "disabled" : ""}>
        <span class="lbl">${i === 0 ? "frühestens" : i === opts.length - 1 ? "spätestens" : "&nbsp;"}</span>
        <b>${WEEKDAYS[o.date.getDay()]}</b>${fmt(o.date)}
      </label>`).join("")}
    </div>`;
}

function renderTasks() {
  const s = loadState();
  $("tasks").innerHTML = schedule(s).map(t => {
    const wd = t.date.getDay(), weekend = wd === 0 || wd === 6;
    const cls = ["task", weekend && "weekend", t.isAnchor && "anchor", s.done[t.id] && "done"].filter(Boolean).join(" ");
    return `<li class="${cls}">
      <div class="when">
        <div class="date">${fmt(t.date)}</div>
        <div class="wd">${WEEKDAYS[wd]}</div>
        <span class="day">Tag ${t.day > 0 ? "+" : ""}${t.day}</span>
      </div>
      <label class="title"><input type="checkbox" data-id="${t.id}" ${s.done[t.id] ? "checked" : ""}>
        ${esc(t.title)} ${sameDay(t.date, today()) ? '<span class="today-badge">heute</span>' : ""}</label>
      <div class="desc">${esc(t.desc)}</div>
    </li>`;
  }).join("");
}

function renderAll() { renderNav(); renderControls(); renderTasks(); }

/* ---------- Kalender-Export ---------- */
function exportIcs() {
  const m = current(), s = loadState();
  const icsEsc = t => t.replace(/\\/g, "\\\\").replace(/[,;]/g, c => "\\" + c).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Imkerjahr Planer//DE", "CALSCALE:GREGORIAN"];
  schedule(s).forEach(t => {
    lines.push("BEGIN:VEVENT",
      `UID:${m.id}-${t.id}-${iso(t.date)}@imkerjahr-planer`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${iso(t.date).replace(/-/g, "")}`,
      `DTEND;VALUE=DATE:${iso(addDays(t.date, 1)).replace(/-/g, "")}`,
      `SUMMARY:${icsEsc(`${m.name}: ${t.title}`)}`,
      `DESCRIPTION:${icsEsc(t.desc)}`,
      "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `${m.id}-${iso(startDate(s))}.ics` });
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Ereignisse ---------- */
$("modules").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (!b || b.disabled) return;
  moduleId = b.dataset.id; store.set("modul", moduleId); renderAll();
});
$("beleg").addEventListener("change", e => {
  const s = loadState(); s.beleg = e.target.value; s.start = ""; saveState(s); renderControls(); renderTasks();
});
$("start").addEventListener("change", e => {
  const s = loadState(); s.start = e.target.value; saveState(s); renderWindow(); renderTasks();
});
$("window").addEventListener("change", e => {
  if (e.target.name !== "startopt") return;
  const s = loadState(); s.start = e.target.value; saveState(s); renderTasks();
});
$("method").addEventListener("change", e => {
  const s = loadState(); s.method = e.target.value; s.done = {}; saveState(s); renderControls(); renderTasks();
});
$("tasks").addEventListener("change", e => {
  if (!e.target.matches("input[type=checkbox]")) return;
  const s = loadState(); s.done[e.target.dataset.id] = e.target.checked; saveState(s); renderTasks();
});
$("reset").addEventListener("click", () => { const s = loadState(); s.done = {}; saveState(s); renderTasks(); });
$("print").addEventListener("click", () => window.print());
$("ics").addEventListener("click", exportIcs);

renderAll();
</script>
</body>
</html>
